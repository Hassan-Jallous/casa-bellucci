name: Deploy to Hostinger (FTP)

# Deployt den statischen Next.js-Export (out/) per FTP nach Hostinger.
# Das PHP-Backend (api/, config.php, .htaccess) und die hochgeladenen
# Karten (pdf/) werden EINMALIG manuell per FTP/Dateimanager eingespielt
# (siehe php-backend/DEPLOY.md) und vom Sync hier BEWUSST ausgeschlossen.

on:
  # Primär: manuell aus dem Actions-Tab starten.
  workflow_dispatch:

  # Optional: automatisch bei push auf main.
  # ACHTUNG: Diesen Trigger erst aktivieren (auskommentieren entfernen),
  # wenn die vier FTP-Secrets gesetzt sind. Sonst schlagen die Runs rot fehl.
  # push:
  #   branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build OHNE NEXT_PUBLIC_BASE_PATH: eigene Domain, Site liegt im Root.
      # NEXT_PUBLIC_MENU_API_BASE bleibt leer -> same-origin Default (/api).
      - name: Build Next.js static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_MENU_API_BASE: ''

      # Build-interne Konsistenz: index.html darf keine fehlenden Chunks referenzieren.
      - name: Verify local out/ chunk references
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path('out')
          html_files = list(root.glob('**/index.html'))
          if not html_files:
              print('FAIL: no index.html in out/')
              sys.exit(1)
          missing = []
          checked = 0
          for html_path in html_files:
              text = html_path.read_text(encoding='utf-8', errors='replace')
              for rel in sorted(set(re.findall(r'/_next/static/chunks/[^"\']+\.js', text))):
                  checked += 1
                  local = root / rel.lstrip('/')
                  if not local.is_file():
                      missing.append(f'{html_path}: {rel}')
          print(f'Checked {checked} chunk refs across {len(html_files)} HTML files')
          if missing:
              print('FAIL missing local chunks:')
              for m in missing:
                  print(' ', m)
              sys.exit(1)
          print('PASS local out/ chunk references')
          PY

      # FTP-Deploy-Action v4.4.0 (latest, Stand 2026-06).
      # Quelle: https://github.com/SamKirkland/FTP-Deploy-Action/releases/latest
      #
      # state-name v3: alter State (.ftp-deploy-sync-state.json) kann Dateien als
      # "unchanged" markieren, obwohl sie auf dem Server fehlen (404). Neuer State
      # erzwingt vollständigen Re-Upload der out/-Dateien.
      - name: Sync out/ to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # Nur der statische Export wird hochgeladen.
          local-dir: ./out/

          # Ziel = public_html-Root auf Hostinger.
          # Als Secret FTP_SERVER_DIR setzen (mit führendem und abschließendem /),
          # z.B. /public_html/ . Falls nicht gesetzt, hier fix anpassen.
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

          state-name: .ftp-deploy-sync-state-v3.json

          # SICHERHEIT: dangerous-clean-slate bleibt AUS (Default false).
          # Wäre es true, würde die Action ALLES im server-dir löschen,
          # auch die unten ausgeschlossenen Dateien (pdf/, api/, config.php,
          # .htaccess). Niemals auf true setzen.
          dangerous-clean-slate: false

          # KRITISCH: Die Action löscht serverseitig entfernte Dateien beim
          # Sync. Diese exclude-Globs schützen die persistenten Backend-Daten,
          # die NICHT aus out/ stammen und manuell verwaltet werden.
          # Format: multiline literal block (|), ein Glob pro Zeile.
          exclude: |
            **/pdf/**
            pdf/**
            config.php
            **/api/**
            api/**
            .htaccess
            **/.htaccess
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.ftp-deploy-sync-state.json
            .ftp-deploy-sync-state.json

      # Live-Konsistenz: HTML und alle referenzierten JS-Chunks müssen 200 liefern.
      - name: Live chunk smoke check
        run: |
          set -euo pipefail
          BASE_URL='https://casabellucci.de'
          # Kurze Wartezeit für FTP/CDN-Propagierung
          sleep 5
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE_URL/" -o /tmp/live-index.html
          python3 - <<'PY'
          import re, sys, urllib.request, ssl
          from concurrent.futures import ThreadPoolExecutor, as_completed
          base = 'https://casabellucci.de'
          html = open('/tmp/live-index.html', encoding='utf-8', errors='replace').read()
          chunks = sorted(set(re.findall(r'/_next/static/chunks/[^"\']+\.js', html)))
          if not chunks:
              print('FAIL: no chunk refs in live index.html')
              sys.exit(1)
          ctx = ssl.create_default_context()
          fails = []
          def check(path: str):
              req = urllib.request.Request(
                  base + path,
                  method='GET',
                  headers={'User-Agent': 'casa-deploy-smoke/1.0', 'Cache-Control': 'no-cache'},
              )
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
                      return path, r.status, len(r.read())
              except urllib.error.HTTPError as e:
                  return path, e.code, 0
              except Exception as e:
                  return path, str(e), 0
          print(f'Checking {len(chunks)} live chunk URLs...')
          with ThreadPoolExecutor(max_workers=8) as ex:
              for fut in as_completed([ex.submit(check, c) for c in chunks]):
                  path, code, size = fut.result()
                  ok = code == 200 and size > 0
                  print(f'{"PASS" if ok else "FAIL"} {code} size={size} {path}')
                  if not ok:
                      fails.append(path)
          if fails:
              print(f'FAIL: {len(fails)} chunk(s) missing after deploy')
              sys.exit(1)
          print('PASS live chunk smoke check')
          PY
